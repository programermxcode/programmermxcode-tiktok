<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Login</title>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Welcome Back</h1>
            <p>Login to continue</p>

            <form>
                <div class="input-box">
                    <input type="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <button type="submit">
                    Login
                </button>
            </form>

            <a href="#">
                Forgot Password?
            </a>

        </div>
    </div>
</body>
</html>
